name: Build site from content

on:
  push:
    branches: [main]
    paths:
      - 'content/site.json'
      - 'src/template.html'
      - 'scripts/build.mjs'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/build.mjs

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Rebuild index.html from content/site.json [skip ci]"
          git push
